name: Build and Deploy Jekyll

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "inbox/**"
      - "README.md"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "inbox/**"
      - "README.md"
  workflow_dispatch:
  # Called by publish-inbox.yml: a push made by the bot cannot trigger a
  # workflow on its own, so the inbox job invokes this one directly.
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to build. The inbox job passes the commit the bot just
          pushed. Without it, checkout defaults to the SHA that started the
          run — the state before the post was written — and the new post is
          built out of existence.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Imagemagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Empty on a normal push, which checks out the triggering commit.
          ref: ${{ inputs.ref }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Validate posts
        # Fails loudly on a post filename Jekyll would otherwise skip in silence.
        run: ruby bin/publish-inbox --check

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Point giscus at this repo ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}

      - name: Build with Jekyll
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
