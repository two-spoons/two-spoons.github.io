name: Publish inbox

# Anything dropped in inbox/ becomes a dated post in _posts/, is committed
# back to the branch, and the site is rebuilt and deployed.

on:
  push:
    branches: [master, main]
    paths:
      - "inbox/**"
  workflow_dispatch:

concurrency:
  group: publish-inbox
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # publish-inbox dates each file by its first commit, so it needs history.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: false

      - name: Convert inbox files into posts
        run: ruby bin/publish-inbox

      - name: Commit the new posts
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _posts inbox
          names=$(git diff --cached --name-only --diff-filter=A -- _posts | xargs -r -n1 basename | paste -sd', ' -)
          git commit -m "publish: ${names:-inbox}"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/jekyll.yml
