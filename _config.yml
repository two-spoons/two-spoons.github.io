# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

title: two_spoons
first_name: two_spoons
middle_name:
last_name:
email: twospoonstv@gmail.com
description: >
  welcome to two_spoons.
footer_text: >
  freedom over facticity
keywords: writing, casting, coding
lang: en
icon: twospoons_circle.png # image in /assets/img/, or an emoji

url: https://twospoons.online
baseurl: "" # subpath of the site, e.g. /blog/. Leave blank for root.
repository: two-spoons/two-spoons.github.io
enforce_ssl: twospoons.online

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
back_to_top: true
search_enabled: true
socials_in_search: true
last_updated: false
impressum_path:
max_width: 930px

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: retrospectives # displayed at the top of /writing/
blog_description: thoughts i was passionate about

# Every post lives at /blog/<year>/<slug>/. Keep this in sync with the
# jekyll-archives permalinks below: the post layout only links tags,
# categories and years if the post URL starts with /blog/.
permalink: /blog/:year/:title/

lsi: true # index used for the "potential connections" list on each post

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

jekyll-archives:
  enabled: [year, tags, categories]
  layouts:
    year: archive-year
    tag: archive-tag
    category: archive-category
  permalinks:
    year: "/blog/:year/"
    tag: "/blog/tag/:name/"
    category: "/blog/category/:name/"

# -----------------------------------------------------------------------------
# Socials
# -----------------------------------------------------------------------------

discord_id: https://discord.gg/MDNXQzfmp2
twitch_username: twospoonstv
substack_username: twospoonsonline

contact_note: >
  send me an email. stalk me wherever. head to discord.

rss_icon: true

# -----------------------------------------------------------------------------
# Comments (giscus). repo is filled in at build time by the deploy workflow.
# Set repo_id and category_id from https://giscus.app/ to switch comments on.
# -----------------------------------------------------------------------------

giscus:
  repo:
  repo_id:
  category: Comments
  category_id:
  mapping: title
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  theme: preferred_color_scheme
  emit_metadata: 0
  lang: en

# -----------------------------------------------------------------------------
# Analytics and verification (all off; add the id, then flip the flag)
# -----------------------------------------------------------------------------

google_analytics:
cronitor_analytics:
pirsch_analytics:
enable_google_analytics: false
enable_cronitor_analytics: false
enable_pirsch_analytics: false

# -----------------------------------------------------------------------------
# Feature flags
# -----------------------------------------------------------------------------

enable_math: true # MathJax typesetting
enable_darkmode: true # light/dark toggle
enable_medium_zoom: true # click to zoom images
enable_progressbar: true # scroll position bar
enable_tooltips: false
enable_navbar_social: false
lazy_loading_images: true

serve_og_meta: false
serve_schema_org: false
og_image:

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank

imagemagick:
  enabled: true # generate responsive .webp variants of images
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats: [".jpg", ".jpeg", ".png", ".tiff", ".gif"]
  output_formats:
    webp: "-quality 85"

# -----------------------------------------------------------------------------
# Jekyll
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

plugins:
  - jekyll-archives
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-toc
  - jemoji

include: ["_pages"]

exclude:
  - bin/
  - Gemfile
  - Gemfile.lock
  - inbox/
  - LICENSE
  - PUBLISHING.md
  - README.md
  - vendor
  - .sass-cache/
  - .jekyll-cache/
  - venv/
  - .ruby-version
  - "*.gemspec"
  - "*.gem"

keep_files:
  - CNAME
  - .nojekyll

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  exclude: ["robots.txt"]
  uglifier_args:
    harmony: true

# -----------------------------------------------------------------------------
# Third-party libraries loaded from CDN
# -----------------------------------------------------------------------------

third_party_libraries:
  google_fonts:
